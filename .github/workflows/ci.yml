name: ci

on:
  push:
  pull_request:

jobs:
  preflight:
    runs-on: arc-runner-dev-amd64
    timeout-minutes: 2
    steps:
      - name: Verify runner availability
        run: |
          echo "ARC runner arc-runner-dev-amd64 is available"
          echo "Runner: $(uname -s) $(uname -m)"

  test:
    needs: [preflight]
    runs-on: arc-runner-dev-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
